services:
  - type: web
    name: edu-institute-frontend
    buildCommand: "npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: "16.x"  # Ensure we are using Node 16.x, which is compatible with Create React App
      - key: NPM_USE
        value: "true"  # Forces Render to use npm instead of Bun
